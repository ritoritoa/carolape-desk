/* Daily report panel */
.daily{padding:20px 24px;margin:0 0 20px;background:linear-gradient(125deg,#fffefa,#f9fcfc);}
.dailyhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:13px;margin-bottom:14px}
.dailyhead h2{font-size:18px;letter-spacing:.04em}.dailyhead p{font-size:11px;color:var(--muted);margin-top:4px}
.daypicker{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:#5f7785;font-weight:750}
.daypicker input{max-width:180px}
.dailystats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:13px}
.dstat{border:1px solid #e0e9ea;background:#f7faf9;border-radius:11px;padding:11px 13px}
.dstat .name{display:block;font-size:11px;color:#7b8d96;margin-bottom:4px}
.dstat .number{display:block;color:#3e6175;font-size:19px;font-weight:850;font-variant-numeric:tabular-nums;word-break:break-word}
.dailybuttons{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.dailybuttons button{min-height:38px}
.dailyhint{font-size:11px;color:#7c9097;line-height:1.75}
.dailypreview{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.dailypreview summary{cursor:pointer;color:#54778b;font-weight:750;font-size:12px}
.dailypreview pre{background:#f4f8f8;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-family:inherit;font-size:12px;border-radius:10px;padding:14px;margin-top:11px;max-height:340px;overflow-y:auto;color:#42596a}
.daytag{font-size:10px;color:#8595a0;margin-top:3px}
@media(max-width:800px){.dailystats{grid-template-columns:repeat(2,minmax(0,1fr))}.daily{padding:17px 14px}.dailybuttons button{flex:1}}
@media(max-width:420px){.dailystats{gap:6px}.dstat{padding:9px}.dstat .number{font-size:16px}.dailybuttons{flex-direction:column}}

<body>
<div id="app" class="wrap"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="import-file" type="file" accept="application/json,.json" style="display:none">
<dialog id="settings-dialog"><div class="dlghead"><h2>料金マスターの編集</h2><button class="ghost" id="settings-close" aria-label="閉じる">×</button></div><p class="dlgrules">料金変更は<strong>新しく作るカードから適用</strong>されます。既存のカードは、その作成時の価格を保持します。金額はギル単位です。</p><div id="settings-fields"></div><div class="dlgfoot"><button class="ghost" id="settings-cancel">キャンセル</button><button class="primary" id="settings-save">変更を保存</button></div></dialog>
<script>
(()=>{'use strict';
const KEY='carolape_lounge_desk_v1'; // 旧版と同じ保存領域を使い、既存のお客様カードを維持
const DEFAULTS={courses:{reserved:{floor:{30:100000,60:200000},private:{30:250000,60:500000}},walkin:{floor:{30:150000,60:300000},private:{30:300000,60:600000}}},bottles:[{id:'cerisier',name:'cerisier（セリシール）',price:300000},{id:'soleil',name:'soleil（ソレイユ）',price:500000},{id:'erablu',name:'erablu（エラブル）',price:1000000},{id:'noel',name:'Noel（ノエル）',price:3000000},{id:'cross',name:'Cross（クロス）',price:5000000}]};
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Number(n)||0).toLocaleString('ja-JP');
const time=t=>t?new Date(t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'--:--';
const date=t=>new Date(t).toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'});
const dt=t=>new Date(t).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const spent=(r,now=Date.now())=>!r.startedAt?0:Math.max(0,(r.endedAt||now)-r.startedAt);
const durationString=ms=>{const mins=Math.floor(ms/60000),secs=Math.floor(ms/1000)%60;return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')+':'+String(secs).padStart(2,'0')};
const remainingText=(r,now=Date.now())=>{if(!r.startedAt)return '着席前';const diff=(r.minutes+30*r.extensions)*60000-spent(r,now);const s=Math.floor(Math.abs(diff)/1000),mm=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');return diff<0?'時間超過 '+mm+':'+ss:'残り '+mm+':'+ss};
const roomName=r=>r.room==='private'?'個室':'通常フロア';
const modeName=r=>r.mode==='walkin'?'当日':'予約';
const courseTitle=r=>`${modeName(r)}・${roomName(r)} ${r.minutes}分`;
const getBase=r=>Number(r.prices?.[r.mode]?.[r.room]?.[r.minutes]||0)*r.people;
const getExtension=r=>r.minutes===30?Number(r.prices?.[r.mode]?.[r.room]?.[30]||0)*r.people*r.extensions:0;
const getBottleSum=r=>(r.catalog||[]).reduce((a,b)=>a+Number(b.price)*(Number(r.orders?.[b.id])||0),0);
const total=r=>getBase(r)+getExtension(r)+getBottleSum(r);
const ymd=t=>{let x=new Date(t);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
// 営業日の区切りは朝6時。21時開始の営業が午前0時を越えても前日付になる。
const BUSINESS_CUTOFF_HOUR=6;
const businessDay=t=>{const d=new Date(t);if(d.getHours()<BUSINESS_CUTOFF_HOUR)d.setDate(d.getDate()-1);return ymd(d)};
const recordBusinessDay=r=>/^\d{4}-\d{2}-\d{2}$/.test(r.businessDate||'')?r.businessDate:businessDay(r.startedAt||r.createdAt||r.paidAt||Date.now());
let reportDate=businessDay(Date.now());
const recordsForDay=day=>state.records.filter(r=>recordBusinessDay(r)===day).sort((a,b)=>(a.startedAt||a.createdAt)-(b.startedAt||b.createdAt)||a.serial-b.serial);
const dayStats=day=>{const records=recordsForDay(day),paid=records.filter(r=>r.paid),unpaid=records.filter(r=>!r.paid);return {records,paid,unpaid,paidSum:paid.reduce((s,r)=>s+total(r),0),unpaidSum:unpaid.reduce((s,r)=>s+total(r),0),people:records.reduce((s,r)=>s+r.people,0)};};
function dayReportText(day,withReceipts=true){
 const st=dayStats(day),bottles=new Map();
 for(const r of st.paid){for(const b of r.catalog){const qty=Number(r.orders?.[b.id])||0;if(!qty)continue;const key=b.name+' / '+b.price;const prev=bottles.get(key)||{name:b.name,qty:0,price:b.price};prev.qty+=qty;bottles.set(key,prev)}}
 const extTimes=st.paid.reduce((s,r)=>s+r.extensions,0);
 const lines=[
  '【CAROLAPE FOUNDATION｜潜水艦担当 業務日報】',
  `営業日：${day}（21:00～翌0:00／午前6時までは前日扱い）`,
  '────────────────────────',
  `接客記録：${st.records.length}組／${st.people}名`,
  `精算済：${st.paid.length}組`,
  `未精算：${st.unpaid.length}組`,
  `延長（精算済）：30分 × ${extTimes}回`,
  `ボトル（精算済）：${bottles.size?[...bottles.values()].map(b=>`${b.name} × ${b.qty}本`).join('、'):'なし'}`,
  `精算済売上：${fmt(st.paidSum)} G`,
  `未精算見込み：${fmt(st.unpaidSum)} G（売上には含めない）`
 ];
 if(withReceipts){
  lines.push('','════════ 全レシート ════════');
  for(const [title,list] of [['精算済レシート',st.paid],['未精算レシート',st.unpaid]]){
   lines.push('',`■ ${title}（${list.length}組）`);
   if(!list.length){lines.push('該当なし');continue}
   for(let i=0;i<list.length;i++){lines.push('',receiptText(list[i]),'────────────────────────')}
  }
  if(!st.records.length)lines.push('該当日の接客記録はありません。');
 }
 return lines.join('\n');
}

function timeAdjust(r){let promptText=`着席時刻を修正（例: 21:05 / 2026-10-25 21:05）。空欄で未設定。\n※日時はこの端末のローカル時刻です。`;let defaultValue=r.startedAt?`${ymd(r.startedAt)} ${time(r.startedAt)}`:`${ymd(Date.now())} ${time(Date.now())}`;let input=window.prompt(promptText,defaultValue);if(input===null)return;if(!input.trim()){r.startedAt=null;r.endedAt=null;r.paid=false;r.paidAt=null;persist();render();return}let normalized=input.trim();if(/^\d{1,2}:\d{2}$/.test(normalized))normalized=ymd(Date.now())+' '+normalized;let ts=Date.parse(normalized.replace(' ','T'));if(!Number.isFinite(ts)){toast('日付と時刻を読み取れませんでした');return}r.startedAt=ts;if(r.endedAt){let answer=window.prompt('退席時刻を確認・修正してください。\n例：2026-10-25 22:00',`${ymd(r.endedAt)} ${time(r.endedAt)}`);if(answer!==null&&answer.trim()){let parsed=answer.trim();if(/^\d{1,2}:\d{2}$/.test(parsed))parsed=ymd(r.endedAt)+' '+parsed;let endTime=Date.parse(parsed.replace(' ','T'));if(!Number.isFinite(endTime)||endTime<ts){toast('退席時刻は着席以降の日時にしてください');return}r.endedAt=endTime}else if(r.endedAt<ts)r.endedAt=ts}persist();render();toast('時刻を修正しました')}
function tick(){let now=Date.now(),clock=document.querySelector('.js-live-clock');if(clock)clock.textContent=dt(now);document.querySelectorAll('.js-duration').forEach(el=>{let r=state.records.find(x=>x.id===el.dataset.id);if(r){let elapsed=spent(r,now);el.textContent=durationString(elapsed);el.classList.toggle('overdue',elapsed>=(r.minutes+r.extensions*30)*60000)}});document.querySelectorAll('.js-remaining').forEach(el=>{let r=state.records.find(x=>x.id===el.dataset.id);if(r){el.textContent=remainingText(r,now);el.classList.toggle('overdue',spent(r,now)>(r.minutes+r.extensions*30)*60000)}})}
const app=document.getElementById('app');app.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;let a=target.dataset.action,v=target.dataset.value,id=target.dataset.id,r=selected();if(a==='new')return create();if(a==='select'){state.selected=id;persist();return render()}if(a==='tab'){state.tab=v;let arr=shownRecords();if(!arr.some(x=>x.id===state.selected))state.selected=arr[0]?.id||null;persist();return render()}if(a==='settings')return openSettings();if(a==='export-json'){download(`CAROLAPE_バックアップ_${ymd(Date.now())}.json`,JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');return toast('JSONバックアップを保存しました')}if(a==='export-csv')return csvSafeDownload();if(a==='copy-day')return copy(dayReportText(reportDate),'営業日報と全レシートをコピーしました');if(a==='download-day'){download(`CAROLAPE_営業日報_${reportDate}.txt`,'\ufeff'+dayReportText(reportDate),'text/plain;charset=utf-8');return toast('営業日報を保存しました')}if(a==='export-day-csv'){exportCSV(recordsForDay(reportDate),`CAROLAPE_営業日会計_${reportDate}.csv`);return}if(a==='import')return document.getElementById('import-file').click();if(!r)return;
switch(a){case 'set-mode':r.mode=v;break;case 'set-room':r.room=v;break;case 'set-minutes':r.minutes=Number(v);r.extensions=0;break;case 'person-plus':r.people=Math.min(2,r.people+1);break;case 'person-minus':r.people=Math.max(1,r.people-1);break;case 'start':r.startedAt=Date.now();r.endedAt=null;break;case 'stop':r.endedAt=Date.now();break;case 'resume':r.endedAt=null;break;case 'adjust-time':return timeAdjust(r);case 'ext-plus':if(r.minutes===30)r.extensions=Math.min(2,r.extensions+1);break;case 'ext-minus':r.extensions=Math.max(0,r.extensions-1);break;case 'bottle-plus':r.orders[v]=(r.orders[v]||0)+1;break;case 'bottle-minus':r.orders[v]=Math.max(0,(r.orders[v]||0)-1);break;case 'copy':return copy(receiptText(r));case 'copy-short':return copy(receiptText(r,true));case 'pay':if(!r.endedAt){if(!confirm('まだ接客終了時刻が確定していません。会計済みにしますか？'))return;}r.paid=true;r.paidAt=Date.now();state.tab='paid';break;case 'unpay':r.paid=false;r.paidAt=null;state.tab='open';break;case 'delete':if(!confirm(`No.${r.serial} のカードを完全に削除しますか？\n元には戻せません。`))return;state.records=state.records.filter(x=>x.id!==r.id);state.selected=shownRecords()[0]?.id||null;break;default:return}persist();render()});
app.addEventListener('change',e=>{if(e.target.id==='report-date'){if(/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){reportDate=e.target.value;render()}return}if(e.target.id==='record-business-date'){let r=state.records.find(x=>x.id===e.target.dataset.recordId);if(r&&/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){r.businessDate=e.target.value;persist();render();toast('カードの営業日を変更しました')}return}if(e.target.id==='customerlabel'){let r=state.records.find(x=>x.id===e.target.dataset.recordId);if(r){r.label=e.target.value.trim();persist();render()}}});
const importer=document.getElementById('import-file');importer.addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||obj.version!==1||!Array.isArray(obj.records)||!obj.catalog?.courses||!Array.isArray(obj.catalog?.bottles))throw Error('バックアップ形式が違います');if(!confirm('現在のカードと設定をすべて置き換えて、バックアップを復元しますか？\n上書き前に今のバックアップを取ることをおすすめします。'))return;state={...fresh(),...obj};if(!state.records.some(r=>r.id===state.selected))state.selected=state.records[0]?.id||null;persist();render();toast('バックアップを復元しました')}catch(err){toast('JSONの読み込みに失敗しました')}finally{importer.value=''}});
const dlg=document.getElementById('settings-dialog');document.getElementById('settings-close').onclick=()=>dlg.close();document.getElementById('settings-cancel').onclick=()=>dlg.close();document.getElementById('settings-save').onclick=saveSettings;
if(!selected()&&state.records.length){state.selected=state.records[0].id}
render();setInterval(tick,1000);
})();
</script>
</body>
